<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Smart Helmet</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#0b1020;--card:#151b30;--line:#242c48;--tx:#e8ecf8;--mu:#8b95b8;--ok:#2ee59d;--warn:#ffb020;--bad:#ff4d6a;--ac:#5b8cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px system-ui,sans-serif;padding:env(safe-area-inset-top) 14px 30px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 2px}
h1{font-size:20px;margin:0}.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mu);margin-left:6px}
.pill.on{color:var(--ok);border-color:var(--ok)}
.grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.wide{grid-column:1/-1}.lbl{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.big{font-size:28px;font-weight:700;margin:6px 0 2px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
#map{height:260px;border-radius:14px;margin-top:8px}
.bar{height:8px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:.4s}
button{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-size:14px;margin:8px 8px 0 0}
input{width:100%;padding:10px;margin:4px 0 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
#alarm{position:fixed;inset:0;background:rgba(190,15,40,.96);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:999}
#alarm h2{font-size:34px;margin:0 0 10px}#alarm a{color:#fff;font-weight:700}
#setup{display:none}
</style>
</head>
<body>
<header><h1>🪖 Smart Helmet</h1><div><span class="pill" id="pb">Bike</span><span class="pill" id="ph">Helmet</span></div></header>
<div id="setup" class="card">
  <div class="lbl">First-time setup (kept only on this phone)</div>
  <p>Channel ID : read key — ThingSpeak channels A (bike), B (helmet), C (alarm)</p>
  <input id="sb" placeholder="Bike: 1234567:READKEY"><input id="sh" placeholder="Helmet: 1234568:READKEY">
  <input id="sa" placeholder="Alarm: 1234569:READKEY"><input id="sn" placeholder="ntfy topic (optional)">
  <button onclick="save()">Save</button>
</div>
<div class="grid" id="main">
  <div class="card"><div class="lbl">Helmet</div><div class="big" id="worn">–</div><div id="link" class="lbl"></div></div>
  <div class="card"><div class="lbl">Alcohol</div><div class="big" id="alc">–</div><div class="lbl" id="alcv"></div></div>
  <div class="card"><div class="lbl">Heart rate</div><div class="big"><span id="bpm">–</span> <small style="font-size:13px;color:var(--mu)">BPM</small></div><div id="cond">–</div></div>
  <div class="card"><div class="lbl">Air quality</div><div class="big" id="aq">–</div><div class="bar"><i id="aqb"></i></div></div>
  <div class="card"><div class="lbl">Bike power</div><div class="big" id="cut">–</div><div class="lbl" id="spd"></div></div>
  <div class="card"><div class="lbl">Fall sensors</div><div class="big" id="fall">–</div><div class="lbl" id="fd"></div></div>
  <div class="card wide"><div class="lbl">Live location</div><div id="map"></div>
    <button id="nb">Get alert notifications</button><button onclick="share()">Copy family setup link</button><button onclick="resetCfg()" style="background:#444">Change settings</button></div>
</div>
<div id="alarm"><h2>🚨 ACCIDENT DETECTED</h2><p>Helmet and bike both fell.</p><p id="aloc"></p><button onclick="dismiss()" style="background:#fff;color:#b00">I'm aware – dismiss</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=id=>document.getElementById(id), set=(id,t,c)=>{const e=$(id);e.textContent=t;if(c)e.className='big '+c};
let cfg=JSON.parse(localStorage.getItem('shcfg')||'null');
if(location.hash.length>1){ const p=new URLSearchParams(location.hash.slice(1)); if(p.get('b')){cfg={b:p.get('b'),h:p.get('h'),a:p.get('a'),n:p.get('n')||''};localStorage.setItem('shcfg',JSON.stringify(cfg));history.replaceState(null,'',location.pathname);} }
function save(){cfg={b:$('sb').value.trim(),h:$('sh').value.trim(),a:$('sa').value.trim(),n:$('sn').value.trim()};localStorage.setItem('shcfg',JSON.stringify(cfg));location.reload();}
function resetCfg(){localStorage.removeItem('shcfg');location.reload();}
function share(){const p=new URLSearchParams({b:cfg.b,h:cfg.h,a:cfg.a,n:cfg.n});const u=location.origin+location.pathname+'#'+p;navigator.clipboard.writeText(u).then(()=>alert('Link copied. Send it only to family: it contains your read keys.'));}
if(!cfg){$('setup').style.display='block';$('main').style.display='none';}

const map=L.map('map').setView([30.33,76.4],12);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
const icon=e=>L.divIcon({html:`<div style="font-size:26px">${e}</div>`,className:'',iconSize:[30,30]});
const mb=L.marker([0,0],{icon:icon('🏍️')}), mh=L.marker([0,0],{icon:icon('🪖')});
let fitted=false,dismissed=0,alarmData=null;

async function last(s){ if(!s)return null; const [id,key]=s.split(':'); try{const r=await fetch(`https://api.thingspeak.com/channels/${id}/feeds/last.json?api_key=${key}`); if(!r.ok)return null; const j=await r.json(); return j&&j.created_at?j:null;}catch(e){return null;} }
const age=j=>j?Date.now()-Date.parse(j.created_at):1e12;
function cond(b){ if(!b)return['No signal','']; if(b<50)return['Low – rest','warn']; if(b<=100)return['Normal','ok']; if(b<=140)return['Elevated','warn']; return['Very high','bad']; }
function aqi(r){ return r<1000?['Good','ok',15]:r<2000?['Moderate','warn',45]:r<3000?['Poor','warn',75]:['Hazardous','bad',100]; }

async function poll(){
  const [B,H,A]=await Promise.all([last(cfg.b),last(cfg.h),last(cfg.a)]);
  const bf=B&&B.field1?B.field1.split(',').map(Number):null, hf=H&&H.field1?H.field1.split(',').map(Number):null;
  const bon=bf&&age(B)<90000, hbOn=hf&&age(H)<90000;
  let h=null,bike=null;
  if(bon){ bike={lat:bf[0],lon:bf[1],gv:bf[2],speed:bf[3],fall:bf[4],aq:bf[5],cut:bf[6]};
    if(bf[7]) h={worn:bf[8],drunk:bf[9],bpm:bf[10],mq3:bf[11],fall:bf[12],gv:bf[13],lat:bf[14],lon:bf[15],bypass:false}; }
  if(hbOn) h={worn:hf[0],drunk:hf[1],bpm:hf[2],mq3:hf[3],fall:hf[4],gv:hf[5],lat:hf[6],lon:hf[7],bypass:true};
  $('pb').className='pill'+(bon?' on':''); $('ph').className='pill'+(h?' on':'');
  $('ph').textContent=h&&h.bypass?'Helmet · hotspot':'Helmet';
  if(h){ set('worn',h.worn?'Worn':'Not worn',h.worn?'ok':'bad'); $('link').textContent=h.bypass?'Bypass mode':'Linked to bike';
    set('alc',h.drunk?'Detected':'Clear',h.drunk?'bad':'ok'); $('alcv').textContent='MQ3 '+h.mq3;
    const c=cond(h.bpm); $('bpm').textContent=h.bpm||'–'; $('cond').textContent=c[0]; $('cond').className=c[1]; }
  if(bike){ const a=aqi(bike.aq); set('aq',a[0],a[1]); $('aqb').style.width=a[2]+'%'; $('aqb').style.background=`var(--${a[1]})`;
    set('cut',bike.cut?'CUT OFF':'Enabled',bike.cut?'bad':'ok'); $('spd').textContent=bike.gv?bike.speed.toFixed(0)+' km/h':'No GPS fix';
    const both=bike.fall&&h&&h.fall; set('fall',both?'BOTH FELL':'Normal',both?'bad':'ok'); $('fd').textContent=(bike.fall?'Bike fall · ':'')+(h&&h.fall?'Helmet fall':''); }
  const pts=[];
  if(bike&&bike.gv){mb.setLatLng([bike.lat,bike.lon]).addTo(map);pts.push([bike.lat,bike.lon]);}
  if(h&&h.gv){mh.setLatLng([h.lat,h.lon]).addTo(map);pts.push([h.lat,h.lon]);}
  if(pts.length&&!fitted){map.fitBounds(pts,{maxZoom:17,padding:[30,30]});fitted=true;}
  if(A&&Number(A.field1)===1){ const t=Date.parse(A.created_at); alarmData={t,lat:A.field2,lon:A.field3,ok:Number(A.field4)};
    if(t>dismissed&&Date.now()-t<600000){ $('alarm').style.display='flex';
      $('aloc').innerHTML=alarmData.ok?`<a href="https://maps.google.com/?q=${alarmData.lat},${alarmData.lon}" target="_blank">Open location in Maps</a>`:'Location unknown'; siren(); } }
}
function dismiss(){dismissed=alarmData.t;$('alarm').style.display='none';}
let ac,sirenAt=0;
function siren(){ if(Date.now()-sirenAt<4000)return; sirenAt=Date.now(); try{ac=ac||new AudioContext();const o=ac.createOscillator();o.frequency.value=880;o.connect(ac.destination);o.start();o.stop(ac.currentTime+.6);}catch(e){} }
$('nb').onclick=()=>{ if(!cfg.n)return alert('Add your ntfy topic in settings first.'); window.open('https://ntfy.sh/'+cfg.n,'_blank'); };
if(cfg){poll();setInterval(poll,5000);}
</script>
</body>
</html>
